# Full stack locally:  cp .env.example .env  (edit values)  then  docker compose up --build
# Web: http://localhost:8083   API + Swagger: http://localhost:8082/swagger
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env}
    ports:
      - "1434:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db,1433;Database=Vaelo;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      Security__IpHashSalt: ${IP_HASH_SALT:-change-me}
      Seed__AdminEmail: ${ADMIN_EMAIL:-}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
      Database__InitializeOnStartup: "true"
      Swagger__Enabled: "true"
      Cors__AllowedOrigins__0: http://localhost:8083
    ports:
      - "8082:8080"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8082
        VITE_SITE_URL: http://localhost:8083
    depends_on:
      - api
    ports:
      - "8083:80"

volumes:
  sqldata:
